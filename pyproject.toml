[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-agent"
version = "0.1.0"
description = "Voice-driven technical screening agent with a rubric-grounded follow-up decision"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Karim Gamal" }]

# torch is deliberately absent: Colab ships a CUDA-matched build and
# reinstalling it breaks the runtime. See requirements.txt.
dependencies = [
    "transformers>=4.44,<5",
    "sentence-transformers>=3.0",
    "accelerate>=0.33",
    "soundfile>=0.12",
    "numpy>=1.24,<3",
    "uroman>=1.3",
    "openai>=1.40",
    "gradio>=4.44",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
voice-agent = "voice_agent.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
